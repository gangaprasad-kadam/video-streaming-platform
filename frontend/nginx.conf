server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long-term cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router fallback — always return index.html for unknown paths
    location / {
        try_files $uri $uri/ /index.html;
    }
}
