events {
  worker_connections 1024;
}

http {

  # ── Docker internal DNS resolver ───────────────────────────────────────────
  # 127.0.0.11 is Docker's embedded DNS server.
  # Using it here with proxy_pass variables means NGINX resolves upstream
  # hostnames at request time, not at startup — so NGINX starts successfully
  # even when some microservices are not yet running.
  resolver 127.0.0.11 valid=30s ipv6=off;

  # ── Common proxy headers ───────────────────────────────────────────────────
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # ── Rate limiting zones ────────────────────────────────────────────────────
  # Global: 100 requests/second per IP
  limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;
  # Events: tighter limit for viewer event stream (burst still handled by service)
  limit_req_zone $binary_remote_addr zone=events:10m rate=200r/s;

  server {
    listen 80;
    server_name _;

    # Apply global rate limit
    limit_req zone=global burst=50 nodelay;

    # ── User Service (Phase 2) ────────────────────────────────────────────────
    location /auth {
      set $upstream_user http://user-service:8001;
      proxy_pass $upstream_user;
    }

    location /users {
      set $upstream_user http://user-service:8001;
      proxy_pass $upstream_user;
    }

    # ── Video Service (Phase 3) ───────────────────────────────────────────────
    location /videos {
      client_max_body_size 2g;
      set $upstream_video http://video-service:8002;
      proxy_pass $upstream_video;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # ── Streaming Service (Phase 5) ───────────────────────────────────────────
    location /stream {
      set $upstream_stream http://streaming-service:8003;
      proxy_pass $upstream_stream;
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;
      proxy_buffering off;
    }

    # ── AI Summarization Service (Phase 6) ────────────────────────────────────
    location /summary {
      set $upstream_summary http://summarization-service:8004;
      proxy_pass $upstream_summary;
    }

    # ── Trending & Recommendations Service (Phase 7) ──────────────────────────
    location /trending {
      set $upstream_trending http://trending-service:8005;
      proxy_pass $upstream_trending;
    }

    location /recommendations {
      set $upstream_trending http://trending-service:8005;
      proxy_pass $upstream_trending;
    }

    # ── Event Ingestion (Phase 8a) ────────────────────────────────────────────
    location /events {
      limit_req zone=events burst=100 nodelay;
      set $upstream_events http://event-ingestion:8006;
      proxy_pass $upstream_events;
    }

    # ── Heatmap API + SSE (Phase 8c) ─────────────────────────────────────────
    location /heatmap {
      set $upstream_heatmap http://heatmap-api:8007;
      proxy_pass $upstream_heatmap;
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding on;
    }

    # ── Frontend (Phase 9) ────────────────────────────────────────────────────
    location / {
      set $upstream_frontend http://frontend:3000;
      proxy_pass $upstream_frontend;
    }
  }
}
