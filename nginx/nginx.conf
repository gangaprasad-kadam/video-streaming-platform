events {
  worker_connections 1024;
}

http {
  resolver 127.0.0.11 valid=30s ipv6=off;

  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;

  server {
    listen 80;
    server_name _;

    limit_req zone=global burst=50 nodelay;

    # ── User Service ───────────────────────────────────────────────────────
    location /auth {
      set $upstream_user http://user-service:8001;
      proxy_pass $upstream_user;
    }

    location /users {
      set $upstream_user http://user-service:8001;
      proxy_pass $upstream_user;
    }

    # ── Video Service ──────────────────────────────────────────────────────
    location /videos {
      client_max_body_size 2g;
      set $upstream_video http://video-service:8002;
      proxy_pass $upstream_video;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # ── Streaming Service ──────────────────────────────────────────────────
    location /stream {
      set $upstream_stream http://streaming-service:8003;
      proxy_pass $upstream_stream;
      proxy_buffering off;
      proxy_read_timeout 60s;
    }
  }
}
