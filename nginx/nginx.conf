events {
  worker_connections 1024;
}

http {

  # ── Upstream service pool definitions ─────────────────────────────────────
  upstream user_service       { server user-service:8001; }
  upstream video_service      { server video-service:8002; }
  upstream streaming_service  { server streaming-service:8003; }
  upstream summarization_svc  { server summarization-service:8004; }
  upstream trending_service   { server trending-service:8005; }
  upstream event_ingestion    { server event-ingestion:8006; }
  upstream heatmap_api        { server heatmap-api:8007; }
  upstream frontend_app       { server frontend:3000; }

  # ── Common proxy headers ───────────────────────────────────────────────────
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # ── Rate limiting zones ────────────────────────────────────────────────────
  # Global: 100 requests/second per IP
  limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;
  # Events: tighter limit for viewer event stream (burst still handled by service)
  limit_req_zone $binary_remote_addr zone=events:10m rate=200r/s;

  server {
    listen 80;
    server_name _;

    # Apply global rate limit
    limit_req zone=global burst=50 nodelay;

    # ── User Service ─────────────────────────────────────────────────────────
    location /auth/ {
      proxy_pass http://user_service/auth/;
    }

    location /users/ {
      proxy_pass http://user_service/users/;
    }

    # ── Video Service ────────────────────────────────────────────────────────
    location /videos/ {
      # Large uploads: increase body size limit to 2GB
      client_max_body_size 2g;
      proxy_pass http://video_service/videos/;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
    }

    # ── Streaming Service ─────────────────────────────────────────────────────
    location /stream/ {
      proxy_pass http://streaming_service/stream/;
      # Required for HLS byte-range requests
      proxy_set_header Range $http_range;
      proxy_set_header If-Range $http_if_range;
      proxy_buffering off;
    }

    # ── AI Summarization Service ──────────────────────────────────────────────
    location /summary/ {
      proxy_pass http://summarization_svc/summary/;
    }

    # ── Trending & Recommendations Service ───────────────────────────────────
    location /trending/ {
      proxy_pass http://trending_service/trending/;
    }

    location /recommendations/ {
      proxy_pass http://trending_service/recommendations/;
    }

    # ── Event Ingestion ───────────────────────────────────────────────────────
    location /events/ {
      limit_req zone=events burst=100 nodelay;
      proxy_pass http://event_ingestion/events/;
    }

    # ── Heatmap API + SSE ─────────────────────────────────────────────────────
    location /heatmap/ {
      proxy_pass http://heatmap_api/heatmap/;
      # SSE (Server-Sent Events) requires:
      proxy_buffering off;
      proxy_cache off;
      proxy_set_header Connection '';
      proxy_http_version 1.1;
      chunked_transfer_encoding on;
    }

    # ── Frontend ──────────────────────────────────────────────────────────────
    location / {
      proxy_pass http://frontend_app/;
    }
  }
}
