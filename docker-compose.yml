services:

  # ─────────────────────────────────────────────
  # DATABASE LAYER
  # ─────────────────────────────────────────────

  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # KAFKA + ZOOKEEPER
  # ─────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # One-shot container: creates all Kafka topics after broker is healthy
  kafka-setup:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: on-failure
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic video.uploaded             --partitions 3  --replication-factor 1 &&
       kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic video.processed            --partitions 3  --replication-factor 1 &&
       kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic viewer-interaction-events  --partitions 12 --replication-factor 1 &&
       kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic heatmap-aggregated         --partitions 6  --replication-factor 1 &&
       kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic heatmap-alerts             --partitions 3  --replication-factor 1 &&
       echo 'All 5 Kafka topics created successfully'"

  # ─────────────────────────────────────────────
  # API GATEWAY
  # ─────────────────────────────────────────────

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - media_data:/media:ro            # serves uploaded thumbnails
    depends_on:
      - kafka

  # ─────────────────────────────────────────────
  # MICROSERVICES  (added phase by phase)
  # ─────────────────────────────────────────────

  user-service:
    build: ./services/user-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${USER_SERVICE_PORT}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./services/shared:/app/shared:ro
    ports:
      - "${USER_SERVICE_PORT}:${USER_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["services"]    # only start with --profile services

  video-service:
    build: ./services/video-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${VIDEO_SERVICE_PORT}
    volumes:
      - ./services/shared:/app/shared:ro
      - media_data:/media
    ports:
      - "${VIDEO_SERVICE_PORT}:${VIDEO_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles: ["services"]

  encoding-worker:
    build: ./services/encoding-worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./services/shared:/app/shared:ro
      - media_data:/media
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles: ["services"]

  thumbnail-worker:
    build: ./services/thumbnail-worker
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./services/shared:/app/shared:ro
      - media_data:/media
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles: ["services"]

  streaming-service:
    build: ./services/streaming-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${STREAMING_SERVICE_PORT}
    volumes:
      - ./services/shared:/app/shared:ro
      - media_data:/media:ro
    ports:
      - "${STREAMING_SERVICE_PORT}:${STREAMING_SERVICE_PORT}"
    depends_on:
      redis:
        condition: service_healthy
    profiles: ["services"]

  summarization-service:
    build: ./services/summarization-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${SUMMARIZATION_SERVICE_PORT}
    volumes:
      - ./services/shared:/app/shared:ro
      - media_data:/media:ro
      - model_cache:/root/.cache
    ports:
      - "${SUMMARIZATION_SERVICE_PORT}:${SUMMARIZATION_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles: ["services"]

  trending-service:
    build: ./services/trending-service
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${TRENDING_SERVICE_PORT}
    volumes:
      - ./services/shared:/app/shared:ro
    ports:
      - "${TRENDING_SERVICE_PORT}:${TRENDING_SERVICE_PORT}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles: ["services"]

  event-ingestion:
    build: ./services/event-ingestion
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${EVENT_INGESTION_PORT}
    volumes:
      - ./services/shared:/app/shared:ro
    ports:
      - "${EVENT_INGESTION_PORT}:${EVENT_INGESTION_PORT}"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles: ["services"]

  heatmap-aggregator:
    build: ./services/heatmap-aggregator
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./services/shared:/app/shared:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles: ["services"]

  heatmap-api:
    build: ./services/heatmap-api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: ${HEATMAP_API_PORT}
    volumes:
      - ./services/shared:/app/shared:ro
    ports:
      - "${HEATMAP_API_PORT}:${HEATMAP_API_PORT}"
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    profiles: ["services"]

  # ─────────────────────────────────────────────
  # FRONTEND  (Phase 9)
  # ─────────────────────────────────────────────

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - nginx
    profiles: ["frontend"]

# ─────────────────────────────────────────────
# NAMED VOLUMES
# ─────────────────────────────────────────────

volumes:
  postgres_data:
  mongo_data:
  media_data:       # shared between video-service, encoding-worker, streaming-service
  model_cache:      # Whisper + BART model files (avoids re-download on restart)
